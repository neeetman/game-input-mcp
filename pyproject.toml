[project]
name = "windows-input-mcp"
version = "0.1.0"
description = "MCP server for OS-level Windows input (keyboard/mouse) with framebuffer↔client↔screen scope auto-translation. Designed for driving Unity games during navigate-to-gameplay workflow."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pillow>=10.0.0",
    "mss>=9.0.0; sys_platform == 'win32'",
    "dxcam>=0.3.0; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
windows-input-mcp = "windows_input_mcp.server:main"
windows-input-daemon = "windows_input_mcp.daemon:main"
windows-input-install = "windows_input_mcp.install:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["windows_input_mcp"]
