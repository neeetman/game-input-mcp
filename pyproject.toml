[project]
name = "game-input-mcp"
version = "0.1.0"
description = "MCP server for Windows game screenshots and OS-level keyboard/mouse input with capture↔client↔screen coordinate translation."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pillow>=10.0.0",
    "mss>=9.0.0; sys_platform == 'win32'",
    "dxcam>=0.3.0; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
game-input-mcp = "game_input_mcp.server:main"
game-input-daemon = "game_input_mcp.daemon:main"
game-input-install = "game_input_mcp.install:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["game_input_mcp"]
